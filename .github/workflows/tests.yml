name: Tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
# a new push to a pull request supersedes the run on its previous head; every commit on main finishes its run
concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# bash, so a piped step fails with the command that failed in it
defaults:
  run:
    shell: bash
jobs:
  # every pull request, and main once it lands
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      # Claudinite's checks; the engine update keeps these steps current.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/claudinite
            ~/.npm/_cacache
          key: cn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.claudinite/settings.yaml') }}
          restore-keys: cn-${{ runner.os }}-${{ runner.arch }}-
      - name: install the engine settings.yaml pins
        run: npx --yes --prefer-offline @claudinite/setup@1.0.1
      - name: name the Claudinite checks build
        id: claudinite-checks
        continue-on-error: true
        run: .claudinite/bin/cn check key >> "$GITHUB_OUTPUT"
      - if: steps.claudinite-checks.outputs.key != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.claudinite-checks.outputs.dir }}
          key: claudinite-checks-${{ runner.os }}-${{ runner.arch }}-${{ steps.claudinite-checks.outputs.key }}
      - name: cn check work-and-world
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .claudinite/bin/cn check work-and-world
  image:
    if: github.event_name != 'push'
    uses: ./.github/workflows/test-image.yml
    with:
      engines: chromium
    permissions:
      contents: read
      packages: write
  # every test, on Chromium, before the pull request can merge (req/checks/ci-sets), in the test image, with no way off the
  # machine: a third of them on each of three runners side by side
  shard:
    needs: image
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: tests (${{ matrix.shard }} of 3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin && docker pull -q "$IMAGE"
        env:
          TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.image.outputs.image }}-chromium
      - name: Run a third of the tests
        run: sh dev/tools/test-image/run.sh "$IMAGE"
        env:
          IMAGE: ${{ needs.image.outputs.image }}-chromium
          SHARD: ${{ matrix.shard }}/3
  # the one check every test passed, the three runners' together
  tests:
    if: always() && github.event_name != 'push'
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.shard.result }}
  version-history:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Each pull request tells its change for the page's users, or that it tells none
        run: python3 dev/tools/build/version_history.py check origin/${{ github.base_ref }}

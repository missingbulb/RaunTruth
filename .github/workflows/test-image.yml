name: Test image
# The image each engine's test runs run in (req/checks/ci-sets/one-image), tagged by a hash of the repo's files it is
# built from (dev/tools/test-image/inputs.py) and the engine: each of ENGINES built and pushed only when no image of
# its tag is there yet, from the layers of the engine's image built last (its cache tag) wherever they still match. The
# output is the tag without the engine; a run on an engine appends -<engine>.
on:
  workflow_call:
    inputs:
      engines:
        type: string
        required: true
    outputs:
      image:
        value: ${{ jobs.image.outputs.image }}
# bash, so a piped step fails with the command that failed in it
defaults:
  run:
    shell: bash
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: tag
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/tests:$(python3 dev/tools/test-image/inputs.py --tag)" >> "$GITHUB_OUTPUT"
      - run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          TOKEN: ${{ github.token }}
      - name: Build and push each engine's image, unless it is already there
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          ENGINES: ${{ inputs.engines }}
        run: |
          python3 dev/tools/test-image/inputs.py --context "$RUNNER_TEMP/inputs"
          for engine in $ENGINES; do
            if docker manifest inspect "$IMAGE-$engine" > /dev/null 2>&1; then echo "$IMAGE-$engine is already there"; continue; fi
            cache="${IMAGE%:*}:cache-$engine"
            docker build --progress plain --build-arg ENGINE="$engine" --build-arg BUILDKIT_INLINE_CACHE=1 --cache-from "$cache" \
              -t "$IMAGE-$engine" -t "$cache" -f "$RUNNER_TEMP/inputs/dev/tools/test-image/Dockerfile" "$RUNNER_TEMP/inputs" 2>&1 \
              | tee "$RUNNER_TEMP/build-$engine.log"
            echo "$engine: $(grep -c ' CACHED$' "$RUNNER_TEMP/build-$engine.log" || true) steps taken from $cache"
            docker push "$IMAGE-$engine"
            docker push "$cache"
          done

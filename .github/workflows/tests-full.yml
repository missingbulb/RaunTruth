name: Full tests
on:
  push:
    branches: [main]
  pull_request:
    paths: ['.github/workflows/tests-full.yml']
  # nightly, best-effort: GitHub may fire it late or drop a night; a failed night mails whoever last changed this line
  schedule:
    - cron: '22 3 * * *'
  workflow_dispatch:
jobs:
  image:
    uses: ./.github/workflows/test-image.yml
    permissions:
      contents: read
      packages: write
  tests:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin && docker pull -q "$IMAGE"
        env:
          TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.image.outputs.image }}
      - name: Run every test
        run: sh dev/tools/test-image/run.sh "$IMAGE"
        env:
          IMAGE: ${{ needs.image.outputs.image }}

  # Main is released only once the full set is green on it; the release task owns the deploy.
  # The full set on Firefox and WebKit, nightly or by hand only; it gates no release, and other_engines.py says
  # when an engine's failures fail the night (req/checks/other-engines).
  other-engines:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin && docker pull -q "$IMAGE"
        env:
          TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.image.outputs.image }}
      - name: Run the full set on ${{ matrix.engine }}
        run: sh dev/tools/test-image/run.sh "$IMAGE" ${{ matrix.engine }}
        env:
          IMAGE: ${{ needs.image.outputs.image }}

  release:
    needs: tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Wake the site release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run claudinite-scheduler.yml -R "$GITHUB_REPOSITORY" -f wake=cloudflare-site/site-release

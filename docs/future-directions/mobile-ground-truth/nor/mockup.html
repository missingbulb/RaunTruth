<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoR phone tagging mockup</title>
<style>
  :root {
    --page: #eef0f3; --ink: #15181d; --soft: #5b6470; --frame: #1b1e24;
    --screen: #ffffff; --panel: #f3f5f8; --line: #d5dae1;
    --yes: #0b6bcb; --yes-ink: #ffffff; --no: #e4e7ec; --no-ink: #15181d;
    --accent: #0b6bcb; --warn: #9a5b00; --ok: #17753a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0e1014; --ink: #eceff3; --soft: #9aa3af; --frame: #000000;
      --screen: #171a20; --panel: #20242c; --line: #333a45;
      --yes: #4da3ff; --yes-ink: #06121f; --no: #2b313b; --no-ink: #eceff3;
      --accent: #4da3ff; --warn: #f0b354; --ok: #5fd08a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px 40px; background: var(--page); color: var(--ink);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .lede { color: var(--soft); margin: 0 0 20px; max-width: 70ch; }
  .row { display: flex; gap: 28px; overflow-x: auto; padding-bottom: 16px; align-items: flex-start; }
  figure { margin: 0; flex: 0 0 auto; }
  figcaption { width: 360px; margin-top: 10px; color: var(--soft); font-size: 13px; }
  figcaption b { color: var(--ink); display: block; font-size: 14px; }
  .phone { width: 360px; height: 740px; border: 8px solid var(--frame); border-radius: 34px;
    background: var(--screen); display: flex; flex-direction: column; overflow: hidden; }
  .bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 8px;
    font-size: 13px; color: var(--soft); }
  .bar strong { color: var(--ink); font-size: 14px; }
  .prog { display: flex; gap: 3px; padding: 0 16px; }
  .prog i { height: 5px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
  .prog i::after { content: ""; position: absolute; inset: 0; width: var(--f, 0%); background: var(--accent); }
  .body { flex: 1; padding: 14px 16px 0; display: flex; flex-direction: column; min-height: 0; }
  .q { font-size: 22px; font-weight: 650; margin: 2px 0 10px; letter-spacing: -0.01em; }
  .hint { color: var(--soft); font-size: 13px; margin: 8px 0 0; }
  .chip { background: #000; border-radius: 12px; overflow: hidden; display: block; width: 100%; }
  .strips { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .strips span { display: block; font-size: 11px; color: var(--soft); margin-top: 2px; }
  .thumb { padding: 12px 16px 22px; display: grid; gap: 10px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button { font: inherit; border: 0; border-radius: 16px; min-height: 72px; font-size: 20px; font-weight: 650; }
  .yes { background: var(--yes); color: var(--yes-ink); }
  .no { background: var(--no); color: var(--no-ink); }
  .small { min-height: 44px; font-size: 15px; font-weight: 500; background: transparent; color: var(--soft);
    border: 1px solid var(--line); border-radius: 12px; }
  .links { display: flex; justify-content: space-between; font-size: 14px; color: var(--accent); padding: 0 4px; }
  .card { background: var(--panel); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .card h3 { margin: 0 0 2px; font-size: 16px; }
  .card p { margin: 0; color: var(--soft); font-size: 13px; }
  .stat { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .stat:last-child { border-bottom: 0; }
  .stat b { font-variant-numeric: tabular-nums; }
  .good { color: var(--ok); } .flag { color: var(--warn); }
  .opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .opts div { border: 2px solid var(--line); border-radius: 12px; padding: 3px; text-align: center; font-size: 12px; color: var(--soft); }
  .opts div.sel { border-color: var(--accent); color: var(--ink); }
  .opts svg { border-radius: 8px; display: block; width: 100%; background: #000; }
  .big { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; }
</style>
</head>
<body>
<h1>NoR Finder on a phone: five moments</h1>
<p class="lede">Placeholder drawings, made-up numbers. Chips stay black in both themes because they are microscope crops. Marks are white and sit off the signal, since the data itself is red and green.</p>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.2"/></filter>
    <g id="node">
      <rect x="-62" y="-9" width="46" height="18" rx="8" fill="#2fe04a"/>
      <rect x="16" y="-9" width="46" height="18" rx="8" fill="#2fe04a"/>
      <rect x="-13" y="-8" width="26" height="16" rx="6" fill="#ff3030"/>
    </g>
    <g id="noise">
      <circle cx="40" cy="38" r="9" fill="#2fe04a" opacity=".5"/>
      <circle cx="286" cy="52" r="7" fill="#ff3030" opacity=".55"/>
      <rect x="230" y="180" width="60" height="10" rx="5" fill="#2fe04a" opacity=".45" transform="rotate(-24 260 185)"/>
      <circle cx="62" cy="196" r="6" fill="#ff3030" opacity=".4"/>
    </g>
  </defs>
</svg>

<div class="row">

<!-- 1 entry -->
<figure>
  <div class="phone">
    <div class="bar"><strong>NoR Finder</strong><span>Dana</span></div>
    <div class="body">
      <p class="q">Welcome back</p>
      <div class="card">
        <h3>Slide5 up-left 2</h3>
        <p>38 of 100 squares done. About 30 min left, in any number of sittings.</p>
        <div class="prog" style="padding:10px 0 0"><i style="flex:1;--f:38%"></i></div>
      </div>
      <div class="card">
        <h3>Your check score</h3>
        <p><span class="good">19 of the last 20</span> hidden check chips right.</p>
      </div>
      <p class="hint">Opens on the next chip. Nothing to choose: the lead picks the image.</p>
      <div style="flex:1"></div>
    </div>
    <div class="thumb">
      <button class="yes">Continue</button>
      <button class="small">Practice first (8 chips)</button>
    </div>
  </div>
  <figcaption><b>1. Entry</b>One tap from opening to the first chip. First visit runs 8 practice chips with the answers shown.</figcaption>
</figure>

<!-- 2 T1 -->
<figure>
  <div class="phone">
    <div class="bar"><span>Square 39 of 100</span><span>chip 3 of 6</span></div>
    <div class="prog"><i style="flex:6;--f:42%"></i><i style="flex:3;--f:38%"></i><i style="flex:1;--f:38%"></i></div>
    <div class="body">
      <p class="q">Is the centre a node?</p>
      <svg class="chip" viewBox="0 0 328 236" role="img" aria-label="Crop: green bar, red spot, green bar in a line">
        <rect width="328" height="236" fill="#000"/>
        <g filter="url(#soft)"><use href="#noise"/><use href="#node" x="164" y="118"/></g>
        <g stroke="#fff" stroke-width="2"><path d="M164 4v14M164 218v14M4 118h14M310 118h14"/></g>
      </svg>
      <div class="strips">
        <div><svg class="chip" viewBox="0 0 160 70"><rect width="160" height="70" fill="#000"/><g filter="url(#soft2)" fill="#cfcfcf"><rect x="20" y="29" width="44" height="12" rx="6"/><rect x="96" y="29" width="44" height="12" rx="6"/><circle cx="18" cy="12" r="4" opacity=".5"/></g></svg><span>Caspr alone</span></div>
        <div><svg class="chip" viewBox="0 0 160 70"><rect width="160" height="70" fill="#000"/><g filter="url(#soft2)" fill="#cfcfcf"><rect x="68" y="29" width="24" height="12" rx="5"/><circle cx="140" cy="16" r="3" opacity=".55"/></g></svg><span>Nav alone</span></div>
      </div>
      <p class="hint">Swipe right for yes, left for no, up for can't tell.</p>
    </div>
    <div class="thumb">
      <div class="two"><button class="no">No</button><button class="yes">Yes</button></div>
      <div class="links"><span>Back</span><span>Can't tell</span></div>
    </div>
  </div>
  <figcaption><b>2. Main task (T1)</b>One chip turned level, ticks in the margin point at what is asked. The helper is not told what the finder thought. About 2 s.</figcaption>
</figure>

<!-- 3 hard case T3 -->
<figure>
  <div class="phone">
    <div class="bar"><span>Square 39 of 100</span><span>bars</span></div>
    <div class="prog"><i style="flex:6;--f:42%"></i><i style="flex:3;--f:40%"></i><i style="flex:1;--f:38%"></i></div>
    <div class="body">
      <p class="q">Which ends fit best?</p>
      <svg class="chip" viewBox="0 0 328 190" role="img" aria-label="Node with a white length bar above it and its brightness profile below">
        <rect width="328" height="190" fill="#000"/>
        <g filter="url(#soft)"><g transform="translate(164 70) scale(1.7)"><use href="#node"/></g></g>
        <g stroke="#fff" stroke-width="2" fill="none"><path d="M132 30h64M132 22v16M196 22v16"/></g>
        <path d="M10 170 C50 168 70 120 100 118 S128 166 164 168 S200 122 228 118 S280 168 318 170" stroke="#fff" stroke-width="1.5" fill="none" opacity=".8"/>
        <g stroke="#fff" stroke-dasharray="3 3" opacity=".7"><path d="M132 110v70M196 110v70"/></g>
      </svg>
      <p class="hint" style="margin:6px 0 8px">White line under the crop: Caspr brightness along the fibre.</p>
      <div class="opts">
        <div><svg viewBox="0 0 100 46"><g filter="url(#soft2)"><g transform="translate(50 28) scale(.62)"><use href="#node"/></g></g><path d="M38 10h24M38 6v8M62 6v8" stroke="#fff" stroke-width="1.5" fill="none"/></svg>Shorter</div>
        <div class="sel"><svg viewBox="0 0 100 46"><g filter="url(#soft2)"><g transform="translate(50 28) scale(.62)"><use href="#node"/></g></g><path d="M34 10h32M34 6v8M66 6v8" stroke="#fff" stroke-width="1.5" fill="none"/></svg>As found</div>
        <div><svg viewBox="0 0 100 46"><g filter="url(#soft2)"><g transform="translate(50 28) scale(.62)"><use href="#node"/></g></g><path d="M28 10h44M28 6v8M72 6v8" stroke="#fff" stroke-width="1.5" fill="none"/></svg>Longer</div>
      </div>
      <p class="hint">None fits? Slide either end with your thumb.</p>
    </div>
    <div class="thumb">
      <div class="two"><button class="no">Slide ends</button><button class="yes">This one</button></div>
      <div class="links"><span>Back</span><span>Tilted: send to desktop</span></div>
    </div>
  </div>
  <figcaption><b>3. Hard case (T3)</b>Only after "bars are off". Pick among ready-made ends, else slide one end along the fibre. A tilted axis is not fixed here.</figcaption>
</figure>

<!-- 4 area check -->
<figure>
  <div class="phone">
    <div class="bar"><span>Square 39 of 100</span><span>last look</span></div>
    <div class="prog"><i style="flex:6;--f:43%"></i><i style="flex:3;--f:40%"></i><i style="flex:1;--f:38%"></i></div>
    <div class="body">
      <p class="q">Any node left here?</p>
      <svg class="chip" viewBox="0 0 328 328" role="img" aria-label="One square of the image; answered items shown as faint outlines">
        <rect width="328" height="328" fill="#000"/>
        <g filter="url(#soft2)">
          <g opacity=".22"><g transform="translate(80 70) rotate(18) scale(.5)"><use href="#node"/></g><g transform="translate(230 110) rotate(-40) scale(.5)"><use href="#node"/></g><g transform="translate(120 250) rotate(70) scale(.5)"><use href="#node"/></g></g>
          <g transform="translate(236 244) rotate(-12) scale(.5)"><use href="#node"/></g>
          <circle cx="40" cy="170" r="5" fill="#ff3030" opacity=".7"/><circle cx="170" cy="160" r="6" fill="#2fe04a" opacity=".6"/>
          <rect x="250" y="30" width="40" height="7" rx="3" fill="#2fe04a" opacity=".5"/><circle cx="296" cy="300" r="4" fill="#ff3030" opacity=".5"/>
        </g>
        <g fill="none" stroke="#fff" stroke-width="1" opacity=".55"><rect x="44" y="52" width="72" height="36" rx="4" transform="rotate(18 80 70)"/><rect x="194" y="92" width="72" height="36" rx="4" transform="rotate(-40 230 110)"/><rect x="84" y="232" width="72" height="36" rx="4" transform="rotate(70 120 250)"/></g>
        <g fill="none" stroke="#fff" stroke-width="2"><circle cx="236" cy="244" r="30" stroke-dasharray="5 4"/></g>
        <g><circle cx="236" cy="150" r="42" fill="#000" stroke="#fff" stroke-width="2"/><g filter="url(#soft2)"><g transform="translate(236 150) rotate(-12)"><use href="#node"/></g></g><path d="M236 138v24M224 150h24" stroke="#fff" stroke-width="1"/></g>
      </svg>
      <p class="hint">Faint boxes are already answered. Touch a spot: the loupe opens above your finger.</p>
    </div>
    <div class="thumb">
      <div class="two"><button class="no">Nothing left</button><button class="yes">Mark this</button></div>
      <div class="links"><span>Back</span><span>Can't tell</span></div>
    </div>
  </div>
  <figcaption><b>4. Area check (T4)</b>The coarse last step of each square. Most misses were already asked as ordinary chips, so this is usually one tap.</figcaption>
</figure>

<!-- 5 done -->
<figure>
  <div class="phone">
    <div class="bar"><strong>Slide5 up-left 2</strong><span>done</span></div>
    <div class="prog"><i style="flex:6;--f:100%"></i><i style="flex:3;--f:100%"></i><i style="flex:1;--f:100%"></i></div>
    <div class="body">
      <p class="big">100 squares</p>
      <p class="hint" style="margin:0 0 12px">52 minutes over 9 sittings</p>
      <div class="card">
        <div class="stat"><span>Nodes</span><b>218</b></div>
        <div class="stat"><span>Not nodes</span><b>391</b></div>
        <div class="stat"><span>Marked by you</span><b>7</b></div>
        <div class="stat"><span>Bars fit / corrected</span><b>183 / 29</b></div>
        <div class="stat"><span class="flag">For the lead on desktop</span><b class="flag">24</b></div>
        <div class="stat"><span>Hidden checks right</span><b class="good">61 of 66</b></div>
      </div>
      <p class="hint">The 24: 15 can't tell, 6 tilted, 3 where you and Noa disagreed.</p>
      <div style="flex:1"></div>
    </div>
    <div class="thumb">
      <button class="yes">Send</button>
      <button class="small">Next image</button>
    </div>
  </div>
  <figcaption><b>5. Done</b>What was made, how well the hidden checks went, and what is left for desktop. Send hands it in as a submission, not as accepted truth.</figcaption>
</figure>

</div>
</body>
</html>
